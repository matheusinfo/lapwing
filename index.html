<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lapwing</title>
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before the first paint (see src/ui/theme.ts).
      (function () {
        var pref;
        try {
          pref = localStorage.getItem('lapwing:theme');
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23e8590c'/><path d='M9 22c3-9 8 1 14-12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/></svg>"
    />
  </head>
  <body>
    <nav id="app-nav" class="app-nav">
      <a class="nav-logo" href="#/routes" aria-label="Lapwing">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" />
          <path d="M9 22c3-9 8 1 14-12" />
        </svg>
      </a>
      <div class="nav-items"></div>
      <button id="theme-toggle" class="nav-theme" type="button"></button>
      <select id="lang" class="nav-lang" aria-label="Language">
        <option value="en">EN</option>
        <option value="pt-BR">PT</option>
      </select>
    </nav>

    <main id="app-main" class="app-main"></main>

    <div id="toast" role="status"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
