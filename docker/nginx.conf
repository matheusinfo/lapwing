# nginx do Lapwing (imagem Docker). Ver docs/getting-started/docker.md.
#
# O app é estático e usa rotas com "#" (#/history), então não há fallback de
# SPA. Funciona tanto na raiz (/) quanto em subpasta (BASE_PATH=/lapwing/).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Atrás de um proxy reverso (Traefik, Caddy...), redireciona mantendo a
    # porta e o esquema que o navegador usou.
    absolute_redirect off;

    # Cabeçalhos repetidos em cada location: no nginx, um add_header dentro de
    # uma location descarta os herdados do server.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Arquivos com hash no nome (em /assets/ ou /<subpasta>/assets/): cache longo.
    location ~ /assets/[^/]+$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Worker do MapLibre (.mjs): o mime.types do nginx não conhece a extensão.
        location ~ \.mjs$ {
            types { }
            default_type application/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
    }

    # index.html sempre revalidado, para pegar a versão nova após um deploy.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }
}
